[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "android-harness"
version = "0.1.0"
description = "Android device control over adb: structured accessibility-tree reads plus precise input, with scrcpy for the human-visible mirror."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
android-harness = "androidharness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
